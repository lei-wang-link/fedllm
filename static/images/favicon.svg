<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg-gradient)"/>
  
  <!-- Federated network nodes (representing distributed clients) -->
  <!-- Top left node -->
  <circle cx="16" cy="20" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Top right node -->
  <circle cx="48" cy="20" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom left node -->
  <circle cx="16" cy="44" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom right node -->
  <circle cx="48" cy="44" r="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Center server node (larger) -->
  <circle cx="32" cy="32" r="6" fill="#ffd700" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Connection lines from clients to server -->
  <line x1="16" y1="20" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="48" y1="20" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="44" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="48" y1="44" x2="32" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Small "FL" text in center -->
  <text x="32" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#764ba2" text-anchor="middle">FL</text>
</svg>